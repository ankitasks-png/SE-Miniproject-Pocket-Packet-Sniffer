[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-packet-sniffer"
version = "0.1.0"
description = "Local-only Sprint 1 Zeek log summary and alert MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pocket-sniffer = "pocket_sniffer.cli:main"
pocket-sniffer-pcap = "pocket_sniffer.pcap_cli:main"
pocket-sniffer-export = "pocket_sniffer.export_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["pocket_sniffer"]

[tool.coverage.report]
show_missing = true
fail_under = 80
